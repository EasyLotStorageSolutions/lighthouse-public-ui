<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sell Something — Lighthouse Marketplace</title>
    <style>
      :root {
        --ink: #06131e;
        --sky: #8bdcff;
        --gold: #e6b75c;
        --muted: #aec4d1;
        --line: #8bdcff38;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 85% 0, #174d65, #06131e 42%);
        color: #f8fbff;
        font-family: Arial, sans-serif;
      }
      .shell {
        max-width: 1100px;
        margin: auto;
        padding: 28px 20px 80px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .top a {
        color: white;
        text-decoration: none;
      }
      .back {
        padding: 11px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }
      .hero {
        padding: 72px 0 38px;
        max-width: 800px;
      }
      .eyebrow {
        color: var(--sky);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .hero h1 {
        font-family: Georgia, serif;
        font-size: clamp(48px, 8vw, 92px);
        line-height: 0.92;
        margin: 14px 0;
      }
      .hero p,
      .note {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
      }
      .categories {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 20px 0 34px;
      }
      .category {
        padding: 18px 12px;
        border: 1px solid var(--line);
        background: #ffffff08;
        color: white;
        border-radius: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .category[aria-pressed="true"] {
        background: var(--sky);
        color: var(--ink);
      }
      form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #071c2bcc;
      }
      label {
        display: grid;
        gap: 7px;
        color: #dcecf3;
        font-size: 13px;
      }
      .full {
        grid-column: 1/-1;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 13px;
        border: 1px solid #ffffff33;
        border-radius: 9px;
        background: #06131e;
        color: white;
        font: inherit;
      }
      textarea {
        min-height: 130px;
        resize: vertical;
      }
      .checks {
        display: grid;
        gap: 10px;
      }
      .checks label {
        display: flex;
        align-items: flex-start;
      }
      .checks input {
        width: auto;
        margin-top: 2px;
      }
      button[type="submit"] {
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        background: var(--gold);
        color: #17120a;
        font-weight: 800;
        cursor: pointer;
      }
      .status {
        min-height: 24px;
        color: var(--sky);
      }
      .storage {
        margin-top: 26px;
        padding: 22px;
        border-left: 4px solid var(--sky);
        background: #ffffff08;
      }
      .storage a {
        color: var(--sky);
      }
      .bot {
        position: absolute;
        left: -10000px;
      }
      @media (max-width: 760px) {
        .categories {
          grid-template-columns: repeat(2, 1fr);
        }
        form {
          grid-template-columns: 1fr;
        }
        .full {
          grid-column: auto;
        }
        .hero {
          padding-top: 50px;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="marketplace-sell-theme.css?v=20260905-lighthouse-theme-1"
    />
    <link rel="stylesheet" href="https://easylotstoragesolutions.github.io/lighthouse-public-ui/lighthouse-interior-2040.css?v=20260907-1">
</head>
  <body>
    <main class="shell">
      <nav class="top">
        <a href="marketplace-explore.html?mode=explore"
          ><strong>Lighthouse Marketplace</strong></a
        ><a class="back" href="marketplace-explore.html?mode=explore"
          >BACK TO MARKETPLACE</a
        >
      </nav>
      <header class="hero">
        <div class="eyebrow">GENERAL MARKETPLACE SELLER</div>
        <h1>Sell something.</h1>
        <p>
          Post real goods, vehicles, equipment, business items, free items,
          trades, or something you want. Every submission stays private and
          pending until Lighthouse reviews it.
        </p>
      </header>
      <div class="categories" aria-label="Listing category">
        <button class="category" data-category="vehicles">VEHICLES</button
        ><button class="category" data-category="equipment">EQUIPMENT</button
        ><button class="category" data-category="home-goods">
          HOME &amp; GOODS</button
        ><button class="category" data-category="business-commercial">
          BUSINESS</button
        ><button class="category" data-category="free">FREE</button
        ><button class="category" data-category="trade">TRADE</button
        ><button class="category" data-category="wanted">WANTED</button>
      </div>
      <form id="listingForm">
        <input type="hidden" name="category" id="category" /><label
          >Title<input name="title" maxlength="180" required /></label
        ><label
          >Condition<select name="condition">
            <option value="">Choose one</option>
            <option>New</option>
            <option>Like new</option>
            <option>Good</option>
            <option>Fair</option>
            <option>For parts</option>
            <option>Not applicable</option>
          </select></label
        ><label class="full"
          >Description<textarea
            name="description"
            maxlength="5000"
            required
            placeholder="Describe the real item, condition, and what is included. Do not put phone numbers or addresses here."
          ></textarea></label
        ><label
          >Price, if applicable<input
            name="price"
            type="number"
            min="0"
            step="0.01" /></label
        ><label
          >Private contact email<input
            name="email"
            type="email"
            required /></label
        ><label>City<input name="city" maxlength="120" /></label
        ><label>State<input name="state" maxlength="2" /></label
        ><label class="bot" aria-hidden="true"
          >Website<input name="website" tabindex="-1" autocomplete="off"
        /></label>
        <div class="checks full">
          <label
            ><input type="checkbox" name="authorityCertified" required /> I own
            this item or am authorized to list it.</label
          ><label
            ><input type="checkbox" name="termsAccepted" required /> I accept
            the Marketplace terms.</label
          ><label
            ><input type="checkbox" name="privacyAcknowledged" required /> I
            understand my contact information stays private and Lighthouse
            routes responses.</label
          >
        </div>
        <button class="full" type="submit">SUBMIT FOR REVIEW</button>
        <p class="status full" id="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const endpoint =
          "https://www.easylotstoragesolutions.com/_functions/marketplaceListing",
        form = document.querySelector("#listingForm"),
        status = document.querySelector("#status"),
        category = document.querySelector("#category");
      document.querySelectorAll("[data-category]").forEach(
        (button) =>
          (button.onclick = () => {
            category.value = button.dataset.category;
            document
              .querySelectorAll("[data-category]")
              .forEach((item) =>
                item.setAttribute("aria-pressed", String(item === button)),
              );
            form.scrollIntoView({ behavior: "smooth", block: "start" });
          }),
      );
      form.onsubmit = async (event) => {
        event.preventDefault();
        if (!category.value) {
          status.textContent = "Choose what kind of listing this is first.";
          return;
        }
        const data = Object.fromEntries(new FormData(form));
        data.authorityCertified = form.authorityCertified.checked;
        data.termsAccepted = form.termsAccepted.checked;
        data.privacyAcknowledged = form.privacyAcknowledged.checked;
        status.textContent = "Submitting for review…";
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          const result = await response.json();
          if (!response.ok)
            throw new Error(result.error || "Submission unavailable");
          form.reset();
          category.value = "";
          document
            .querySelectorAll("[data-category]")
            .forEach((item) => item.removeAttribute("aria-pressed"));
          status.textContent =
            "Submitted. Your listing is private and pending Lighthouse review; it is not live yet.";
        } catch (error) {
          status.textContent =
            error.message ||
            "Submission is temporarily unavailable. Please try again.";
        }
      };
    </script>
    <script src="https://easylotstoragesolutions.github.io/lighthouse-public-ui/lighthouse-interior-2040.js?v=20260907-1"></script>
</body>
</html>
