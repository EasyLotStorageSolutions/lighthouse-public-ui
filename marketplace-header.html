<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="https://www.easylotstoragesolutions.com/" target="_top" />

    <style>
*{box-sizing:border-box}html,body{margin:0;background:#071827;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.shell{position:relative;width:min(1120px,100%);margin:auto;padding:76px 28px 24px}
.brand{display:grid;grid-template-columns:36% minmax(0,1fr);align-items:center;gap:24px;color:inherit;text-decoration:none}
.brand-video{display:block;grid-column:2;grid-row:1;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;border-radius:16px;background:#123148}
.brand-lockup{grid-column:1;grid-row:1;display:grid;justify-items:center;text-align:center;padding:12px 0}
.brand-mark{width:38px;height:38px;margin-bottom:6px}.brand-the{display:flex;align-items:center;gap:12px;width:100%;font:600 17px Georgia,serif;letter-spacing:.1em}.brand-the:before,.brand-the:after{content:'';height:1px;flex:1;background:#edca8b99}
.brand-title{font:500 clamp(27px,3.6vw,43px)/1.1 Georgia,serif;letter-spacing:-.035em;margin:6px 0 10px}.brand-by{border-top:1px solid #edca8b66;padding-top:10px;font:10px/1.7 Arial,sans-serif;letter-spacing:.14em}.brand-by br{display:none}
nav{position:absolute;top:16px;left:28px;right:28px;display:flex;justify-content:space-between;gap:16px}nav a,.motion-toggle{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border:1px solid #edca8b99;border-radius:9px;background:#0c293c;color:#fff0d1;font:700 14px/1.2 Arial,sans-serif;text-decoration:none}nav a{min-width:126px}nav a:hover,.motion-toggle:hover{background:#17435b}.motion-toggle{position:absolute;right:40px;bottom:36px;font-size:12px;cursor:pointer;min-width:110px;background:#071827e8}
:focus-visible{outline:3px solid #edca8b;outline-offset:4px}
@media(max-width:700px){.shell{padding:72px 16px 18px}.brand{grid-template-columns:1fr;gap:14px}.brand-video{grid-column:1;grid-row:1;border-radius:12px}.brand-lockup{grid-column:1;grid-row:2;padding:0;width:min(340px,100%);margin:auto}.brand-mark{display:none}.brand-the{font-size:13px}.brand-title{font-size:34px;margin:4px 0 7px}.brand-by{font-size:9px;padding-top:7px}nav{top:14px;left:16px;right:16px}nav a{font-size:13px;min-width:116px}.motion-toggle{position:absolute;right:28px;top:84px;bottom:auto;padding:8px 10px;font-size:11px;min-width:96px}}
/* Keep the original identity on the footage without cropping the video. */
.brand{position:relative;display:block;max-width:840px;margin:auto;isolation:isolate;overflow:hidden;border-radius:16px}
.brand::after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(3,18,31,.82));pointer-events:none}
.brand-lockup{position:absolute;z-index:1;left:50%;bottom:24px;transform:translateX(-50%);width:min(540px,calc(100% - 40px));padding:0;text-shadow:0 2px 10px #000}
.brand-title{font-size:clamp(34px,5vw,58px)}.brand-mark{width:30px;height:30px}.brand-the:before,.brand-the:after{background:#fff9}
.motion-toggle{top:88px;bottom:auto;right:max(40px,calc(50% - 408px))}
@media(max-width:700px){.brand{border-radius:12px}.brand-lockup{bottom:12px;width:calc(100% - 32px);margin:0}.brand-title{font-size:clamp(26px,8vw,38px);margin:3px 0 4px}.brand-the{font-size:12px}.brand-by{font-size:8px;padding-top:5px;letter-spacing:.11em}.motion-toggle{top:80px;right:24px;min-width:86px;min-height:36px;padding:6px 9px}}
.brand::after{inset:0;background:radial-gradient(ellipse at center,rgba(3,18,31,.5),rgba(3,18,31,.12) 75%)}
.brand-lockup{top:50%;bottom:auto;transform:translate(-50%,-50%);width:calc(100% - 48px);text-shadow:0 3px 12px #03121f,0 1px 3px #03121f}
.brand-mark{display:none}.brand-the{width:min(420px,70%);font:400 34px/1.1 'Niconne','Brush Script MT',cursive;letter-spacing:0}
.brand-title{font:400 clamp(64px,9vw,108px)/1.05 'Niconne','Brush Script MT',cursive;letter-spacing:0;margin:3px 0 12px}
.brand-by{font:400 27px/1.25 'Niconne','Brush Script MT',cursive;letter-spacing:0;padding-top:10px;border-color:#fff9}
@media(max-width:700px){.brand-lockup{top:54%;bottom:auto;width:calc(100% - 28px)}.brand-the{font-size:23px;width:66%}.brand-title{font-size:clamp(40px,13.5vw,78px);margin:0 0 6px}.brand-by{font-size:clamp(16px,4.8vw,25px);padding-top:6px}}
/* Original reference arrangement: emblem, serif title, two-line signature. */
.brand-lockup{top:60%;width:calc(100% - 40px)}
.brand-mark{display:block;width:58px;height:58px;margin:0 0 2px}
.brand-the{font:400 36px/1 Georgia,'Times New Roman',serif;width:min(620px,90%);letter-spacing:.04em}
.brand-title{font:400 clamp(42px,7.3vw,82px)/1 Georgia,'Times New Roman',serif;letter-spacing:-.035em;margin:0 0 12px}
.brand-by{font:400 24px/1.35 Arial,sans-serif;letter-spacing:.16em;padding-top:9px;width:min(470px,86%)}.brand-by br{display:block}
@media(max-width:700px){.brand-lockup{top:62%;width:calc(100% - 24px)}.brand-mark{width:27px;height:27px;margin:0}.brand-the{font-size:19px}.brand-title{font-size:clamp(26px,9vw,56px);margin:0 0 6px}.brand-by{font-size:clamp(11px,3.1vw,20px);line-height:1.3;padding-top:5px;letter-spacing:.13em;width:86%}}
</style>
  </head>
  <body>
    <header class="shell">
      <a class="brand" href="/" aria-label="The Lighthouse by Easy Lot Storage Solutions home">
        <video class="brand-video" autoplay muted loop playsinline preload="metadata" poster="https://easylotstoragesolutions.github.io/lighthouse-public-ui/assets/lighthouse-hero-framed.jpg" aria-hidden="true">
          <source src="https://easylotstoragesolutions.github.io/lighthouse-public-ui/assets/lighthouse-hero-framed.mp4" type="video/mp4" />
        </video>
        <span class="brand-lockup" aria-hidden="true">
          <svg class="brand-mark" viewBox="0 0 100 100" role="img" aria-label="Lighthouse">
            <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M43 31h14l9 55H34l9-55Z"/><path d="M39 31h22M42 18h16l4 13H38l4-13Z"/><path d="M47 10h6v8M29 86h42M17 44l13-6M83 44l-13-6M15 60h14M85 60H71"/></g>
          </svg>
          <span class="brand-the">THE</span>
          <span class="brand-title">LIGHTHOUSE</span>
          <span class="brand-by">BY EASY LOT<br />STORAGE SOLUTIONS</span>
        </span>
      </a>
      <nav aria-label="Main navigation">
        <a href="/#how-easy-works">How It Works</a>
        <a href="/customer-portal" data-sign-in>Sign In</a>
      </nav>
      <button class="motion-toggle" type="button" aria-label="Pause hero video">Pause video</button>
    </header>
    <script>
      const heroVideo=document.querySelector('.brand-video');
      const motionButton=document.querySelector('.motion-toggle');
      const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
      function updateMotion(){motionButton.textContent=heroVideo.paused?'Play video':'Pause video';motionButton.setAttribute('aria-label',heroVideo.paused?'Play hero video':'Pause hero video');}
      if(reducedMotion.matches){heroVideo.autoplay=false;heroVideo.pause();}
      heroVideo.addEventListener('play',updateMotion);heroVideo.addEventListener('pause',updateMotion);
      motionButton.addEventListener('click',()=>{if(heroVideo.paused)heroVideo.play().catch(updateMotion);else heroVideo.pause();});
      updateMotion();
      const publicOrigin = 'https://www.easylotstoragesolutions.com';
      const referrerOrigin = (() => { try { return new URL(document.referrer).origin; } catch (error) { return ''; } })();
      const referrerHost = (() => { try { return new URL(referrerOrigin).hostname; } catch (error) { return ''; } })();
      const parentOrigin = referrerOrigin === 'http://localhost:8847' || referrerOrigin === publicOrigin || referrerOrigin === 'https://easylotstoragesolutions.com' || /\.editor\.wix\.com$/.test(referrerHost) ? referrerOrigin : publicOrigin;
      document.addEventListener('click', event => {
        const link = event.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href');
        if (!href || window.parent === window || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        if (link.hasAttribute('data-sign-in')) {
          event.preventDefault();
          window.parent.postMessage({ type: 'easy-lot:signin' }, parentOrigin);
          return;
        }
        if (!href.startsWith('/#')) return;
        event.preventDefault();
        window.parent.postMessage({ type: 'easy-lot:navigate', href }, parentOrigin);
      });
    </script>
  <script src="https://easylotstoragesolutions.github.io/lighthouse-public-ui/lighthouse-chrome-height.js?v=20260908-cleanup1"></script></body>
</html>
